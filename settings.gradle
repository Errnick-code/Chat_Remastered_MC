pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        maven { url 'https://plugins.gradle.org/m2/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'chat-remastered'

def fabricVersionsDir = file('fabric')
if (fabricVersionsDir.exists()) {
    fabricVersionsDir.eachDir { versionDir ->
        if (new File(versionDir, 'build.gradle').exists()) {
            def projectName = ":fabric-${versionDir.name}"
            include projectName
            project(projectName).projectDir = versionDir
        }
    }
}

def forgeVersionsDir = file('forge')
if (forgeVersionsDir.exists()) {
    forgeVersionsDir.eachDir { versionDir ->
        if (new File(versionDir, 'build.gradle').exists()) {
            def projectName = ":forge-${versionDir.name}"
            include projectName
            project(projectName).projectDir = versionDir
        }
    }
}

