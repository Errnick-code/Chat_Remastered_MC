allprojects {
    group = project.maven_group
    version = "${project.mod_version}+${findVersionSuffix(project)}"
}

String findVersionSuffix(Project p) {
    if (p == rootProject) return project.protocol_version
    def parts = p.path.split(':')
    return parts.length > 1 ? parts[1].tokenize('-').last() : project.protocol_version
}

tasks.register('buildAll') {
    group = 'chat-remastered'
    description = 'Builds jars for every registered loader/version combination.'
    dependsOn subprojects.findAll { it.tasks.findByName('build') != null }.collect { "${it.path}:build" }
}

tasks.register('buildFabric') {
    group = 'chat-remastered'
    description = 'Builds jars for every Fabric version.'
    dependsOn subprojects.findAll { it.path.startsWith(':fabric-') }.collect { "${it.path}:build" }
}

tasks.register('buildForge') {
    group = 'chat-remastered'
    description = 'Builds jars for every Forge version.'
    dependsOn subprojects.findAll { it.path.startsWith(':forge-') }.collect { "${it.path}:build" }
}

tasks.register('buildNeoForge') {
    group = 'chat-remastered'
    description = 'Builds jars for every NeoForge version.'
    dependsOn subprojects.findAll { it.path.startsWith(':neoforge-') }.collect { "${it.path}:build" }
}
